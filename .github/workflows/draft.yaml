name: Draft Release

permissions:
  contents: write

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - '*.props'
      - '*.targets'
      - '*.ruleset'
      - 'Directory.*'
      - 'global.json'
      - 'nuget.config'
      - 'version.json'
      - 'kubernetes-client.proj'
      - '.github/workflows/draft.yaml'
    
jobs:
  draft:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: dotnet restore
      run: dotnet restore --verbosity minimal --configfile nuget.config

    - name: dotnet test
      run: dotnet test

    - uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
      with:
        setAllVars: true

    - name: create release
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create -d --generate-notes v$env:NBGV_NuGetPackageVersion
