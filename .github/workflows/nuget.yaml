name: Nuget

on:
  release:
    types: [ released ]
    
jobs:
  nuget:

    runs-on: windows-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: dotnet restore
      run: dotnet restore --verbosity minimal --configfile nuget.config

    - name: dotnet test
      run: dotnet test

    - name: dotnet pack
      run: dotnet pack -c Release src/nuget.proj -o pkg --include-symbols

    - name: dotnet nuget push GitHub Packages
      run: |
        dotnet nuget push pkg\*.nupkg -s https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER -k ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: dotnet nuget push NuGet.org
      run: |
        dotnet nuget push pkg\*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
        
        
  ## Remove old versions of NuGet packages form github NuGet feed
  nuget-delete-old-packages:
    name: "Delete Old NuGet"
    needs: [nuget]
    strategy:
      matrix:
        nuget-package: 
        - "KubernetesClient"
        - "KubernetesClient.Classic"
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
    - name: Delete old NuGet packages
      uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
      with:
        owner: ${{ env.GITHUB_REPOSITORY_OWNER }}
        token: ${{ secrets.GITHUB_TOKEN }}
        package-name: ${{ matrix.nuget-package }}
        package-type: nuget
        min-versions-to-keep: 10
